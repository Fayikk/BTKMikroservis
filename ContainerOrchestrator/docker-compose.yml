services:
  productservice:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices-network
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5
  
  orderservice:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PRODUCT_SERVICE_URL=http://productservice:8080
    networks:
      - microservices-network
    depends_on:
      - productservice
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5

  nginx:
    image: nginx:alpine
    container_name: nginx-loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-network
    depends_on:
      - productservice
      - orderservice
    restart: on-failure

networks:
  microservices-network:
    driver: bridge