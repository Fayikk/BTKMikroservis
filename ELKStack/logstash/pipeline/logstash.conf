input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  if [clientip] {
    geoip {
      source => "clientip"
    }
  }

  mutate {
    add_field => {
      "[@metadata][target_index]" => "logstash-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "changeme"
    index => "%{[@metadata][target_index]}"
  }

  stdout {
    codec => rubydebug
  }
}
